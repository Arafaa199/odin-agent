[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odin-agent"
version = "0.1.0"
description = "Autonomous task agent with tiered approval, LLM routing and a voice-note ingest pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "ollama>=0.4",
    "faster-whisper>=1.0",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
]

[project.scripts]
odin-task-runner = "src.task_runner:main"
odin-ingest = "src.ingest.plaud:main"
odin-watchdog = "src.watchdog:main"
odin-healthprobe = "src.healthprobe:main"
odin-cartographer = "src.cartographer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/scripts makes live OpenRouter calls; run it by hand.
addopts = "--ignore=tests/scripts"
